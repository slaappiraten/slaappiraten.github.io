<title>Slaappiraten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Teamsite van de Slaappiraten: aanwezigheden, schema, stand, topscorers en awards.">
<meta name="theme-color" content="#0c0b09">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slaappiraten">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: één smalle kolom (max 760px) als een kapiteinslogboek; tabbalk onderaan op gsm, onder de header op desktop. Zwart + goud uit het clubschild. */
:root {
  --bg: #0c0b09;
  --surface: #171510;
  --surface-2: #221f18;
  --line: #362f23;
  --fg: #f2ebdd;
  --muted: #a99d87;
  --gold: #c9a467;
  --gold-text: #dcbb80;
  --on-gold: #14110b;
  --good: #5fc48a;
  --bad: #ef6a5b;
  --warn: #e7a94a;
  --sea: #1b2329;
  --font-display: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f4eee2; --surface: #fffaf1; --surface-2: #ece3d0; --line: #dacdb3;
    --fg: #17140e; --muted: #6a5f4b; --gold: #c39a55; --gold-text: #845f22; --on-gold: #14110b;
    --good: #1f8f56; --bad: #c8412f; --warn: #a8670f; --sea: #d6e0e4; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f4eee2; --surface: #fffaf1; --surface-2: #ece3d0; --line: #dacdb3;
  --fg: #17140e; --muted: #6a5f4b; --gold: #c39a55; --gold-text: #845f22; --on-gold: #14110b;
  --good: #1f8f56; --bad: #c8412f; --warn: #a8670f; --sea: #d6e0e4; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
a { color: var(--gold-text); }
button, input, select { font: inherit; color: inherit; }
/* geen zoom bij snel dubbeltikken (knijpen om te zoomen blijft werken) */
html, body, button, a, input, select, label, [data-act] { touch-action: manipulation; }
button, [data-act] { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
@media (pointer: coarse) { input, select, textarea { font-size: max(16px, 1em) !important; } }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--fg); min-width: 0; }
.brand img { width: 32px; height: 42px; object-fit: contain; flex: none; }
.wordmark { font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1; letter-spacing: .22em; text-transform: uppercase; }
.wordmark small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: .06em; color: var(--gold-text); text-transform: none; margin-top: 5px; }
.top .who { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); text-decoration: none; white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-2); border: 1px solid var(--line); font-size: 16px; flex: none; }
.avatar.lg { width: 64px; height: 64px; font-size: 34px; }
@media (max-width: 380px) { .wordmark small { display: none; } .top .who span:last-child { display: none; } }

/* Chat (Snapchat-stijl: gekleurde namen, lijntje links, geen bubbels) */
.chat { display: grid; gap: 2px; padding-bottom: 84px; }
.chat-day { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.chat-group { display: grid; gap: 2px; margin-top: 8px; }
.chat-name { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c); display: flex; gap: 8px; align-items: baseline; }
.chat-name time { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--muted); font-size: 11px; }
.chat-msg { position: relative; border-left: 3px solid var(--c); padding: 2px 10px; cursor: pointer; font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; white-space: pre-wrap; border-radius: 0 6px 6px 0; }
.chat-item.sel > .chat-msg { background: var(--surface-2); }
.composer { position: fixed; left: 0; right: 0; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 19; background: var(--bg); border-top: 1px solid var(--line); }
.composer form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.composer input { flex: 1; border-radius: 999px !important; padding: 11px 16px !important; }
.composer .send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--gold); color: var(--on-gold); display: grid; place-items: center; cursor: pointer; flex: none; }
.composer .send svg { width: 20px; height: 20px; }
.nav a { position: relative; }
.nav .dot[hidden] { display: none; }
.chat-msg.card-msg { border-left: 0; padding: 4px 0; }
.chat-msg.bevel { font-family: var(--display, inherit); font-weight: 800; font-size: 17px; letter-spacing: .02em; color: var(--gold); text-transform: uppercase; }
.chat-msg.bevel::before { content: "📣 Kapiteinsbevel"; display: block; font-size: 10.5px; letter-spacing: .14em; color: var(--muted); margin-bottom: 2px; }
.ccard { border: 1px solid var(--line); border-left: 3px solid var(--c); border-radius: 12px; background: var(--surface); padding: 12px; display: grid; gap: 8px; max-width: 480px; white-space: normal; }
.ccard .k { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ccard .t { font-weight: 800; font-size: 16px; }
.ccard .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.ccard .acts button, .ccard .acts a { font-size: 13px; padding: 7px 11px; border-radius: 999px; border: 1.5px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; text-decoration: none; font-weight: 600; }
.ccard .acts [aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.ccard table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.ccard td { padding: 3px 4px; } .ccard td.n { text-align: right; font-variant-numeric: tabular-nums; } .ccard tr.us td { color: var(--gold); font-weight: 800; }
.popt { position: relative; display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 11px; background: transparent; color: var(--fg); cursor: pointer; overflow: hidden; font: inherit; font-size: 14px; }
.popt .pbar { position: absolute; top: 0; bottom: 0; left: 0; height: auto; border-radius: 0; background: color-mix(in srgb, var(--gold) 22%, transparent); z-index: 0; transition: width .3s; }
.popt > span { position: relative; z-index: 1; } .popt[aria-pressed="true"] { border-color: var(--gold); font-weight: 700; }
.reacts { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 2px 13px; }
.reacts button { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 1px 8px; font-size: 13px; cursor: pointer; }
.reacts button[aria-pressed="true"] { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 18%, transparent); }
.msgbar { display: none; gap: 4px; margin: 2px 0 4px 13px; flex-wrap: wrap; }
.chat-item.sel .msgbar { display: flex; }
.msgbar button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 9px; font-size: 16px; cursor: pointer; color: var(--fg); }
.msgbar .del { font-size: 12px; font-weight: 700; color: var(--bad); }
.tray { max-width: 760px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.tray button { border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 8px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
.tray button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.tray form { display: grid; gap: 6px; width: 100%; }
.composer .plus { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--fg); font-size: 22px; line-height: 1; cursor: pointer; flex: none; transition: transform .2s; }
.composer .plus[aria-expanded="true"] { transform: rotate(45deg); border-color: var(--gold); color: var(--gold); }
.mention { color: var(--c); font-weight: 800; }
.cal-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.nav .dot { position: absolute; top: 5px; left: calc(50% + 8px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; }
@media (min-width: 900px) { .composer { bottom: 0; } .nav .dot { top: 8px; left: auto; right: 18%; } }

/* Nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav ul { list-style: none; margin: 0 auto; padding: 0; display: grid; grid-template-columns: repeat(6, 1fr); max-width: 760px; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 9px; text-decoration: none; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0; }
.nav a svg { width: 22px; height: 22px; }
.nav a[aria-current="page"] { color: var(--gold-text); }
.nav a[aria-current="page"] svg { stroke: var(--gold); }
main { padding-block: 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 900px) {
  .nav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); background: var(--bg); }
  .nav a { flex-direction: row; justify-content: center; gap: 8px; font-size: 14px; padding: 12px 4px; }
  .nav a svg { width: 18px; height: 18px; }
  main { padding-bottom: 48px; }
}

/* Type */
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(24px, 6vw, 34px); }
h2 { font-size: 17px; letter-spacing: .08em; }
h3 { font-size: 14px; letter-spacing: .08em; }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--gold-text); margin: 0; }
.stack { display: grid; gap: 14px; }
.section { display: grid; gap: 12px; margin-top: 26px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head a { font-size: 13px; font-weight: 600; text-decoration: none; }
.rule { width: 56px; height: 2px; background: var(--gold); border: 0; margin: 8px 0 0; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.row { display: flex; align-items: center; gap: 12px; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.list { display: grid; }
.list > * { padding: 11px 0; border-bottom: 1px solid var(--line); }
.list > *:last-child { border-bottom: 0; }
.banner { background: var(--surface-2); border: 1px dashed var(--gold); border-radius: var(--radius); padding: 10px 14px; font-size: 13.5px; }

/* Hero: volgende wedstrijd */
.hero { position: relative; overflow: hidden; gap: 18px !important; background: radial-gradient(120% 140% at 100% 0%, color-mix(in srgb, var(--gold) 20%, transparent), transparent 55%), var(--surface); border: 1px solid color-mix(in srgb, var(--gold) 50%, var(--line)); border-radius: 18px; padding: 18px; display: grid; gap: 16px; }
.hero > * { position: relative; }
.hero .crest-bg { position: absolute; right: -30px; bottom: -40px; width: 180px; opacity: .08; pointer-events: none; }
.versus { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; }
.versus .team { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: clamp(12.5px, 3.7vw, 21px); letter-spacing: .01em; line-height: 1.15; overflow-wrap: normal; word-break: normal; hyphens: manual; }
.versus .team.us { color: var(--gold-text); }
.versus .mid { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .2em; color: var(--muted); }
.versus .score { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 9vw, 44px); line-height: 1; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); justify-content: center; align-items: center; margin: 0; }
.countdown { display: flex; justify-content: center; gap: 8px; }
.countdown div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-width: 58px; text-align: center; }
.countdown b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.15; }
.countdown span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }

/* Aanwezig-knoppen */
.rsvp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rsvp button { border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 6px; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; transition: transform .12s ease, background .12s; }
.rsvp button small { font-weight: 500; font-size: 11.5px; color: var(--muted); }
.rsvp button:hover { transform: translateY(-1px); }
.rsvp button[aria-pressed="true"][data-s="yes"] { background: var(--good); border-color: var(--good); color: #08140d; }
.rsvp button[aria-pressed="true"][data-s="maybe"] { background: var(--warn); border-color: var(--warn); color: #1a1003; }
.rsvp button[aria-pressed="true"][data-s="no"] { background: var(--bad); border-color: var(--bad); color: #1c0805; }
.rsvp button[aria-pressed="true"][data-s="fan"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
.rsvp button.fan:not([aria-pressed="true"]) { border-color: var(--gold); border-style: dashed; }
.rsvp-note { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.who-cols { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 14px; }
.who-cols > div { display: grid; gap: 6px; align-content: start; min-width: 0; }
.who-cols .fans { border-left: 1px solid var(--line); padding-left: 14px; }
@media (max-width: 380px) { .who-cols { grid-template-columns: 1fr; } .who-cols .fans { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 10px; } }
.rsvp button[aria-pressed="true"] small { color: inherit; opacity: .8; }

/* Bemanningsmeter */
.crew { display: grid; gap: 8px; }
.slots { display: flex; gap: 5px; flex-wrap: wrap; }
.slot { width: 26px; height: 26px; border-radius: 50%; border: 1.5px dashed var(--line); display: grid; place-items: center; font-size: 14px; }
.slot.on { border: 1.5px solid var(--good); background: color-mix(in srgb, var(--good) 18%, transparent); }
.slot.extra { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 18%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.pill.gold { color: var(--gold-text); border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }

/* Seizoen */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
.tile b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.15; }
.tile span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.form { display: flex; gap: 6px; }
.res { width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 14px; flex: none; }
.res.W { background: var(--good); color: #08140d; }
.res.G { background: var(--warn); color: #1a1003; }
.res.V { background: var(--bad); color: #1c0805; }
.res.empty { border: 1.5px dashed var(--line); }

/* Schatkist / doelsaldo */
.treasure { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.treasure .big { font-family: var(--font-display); font-weight: 800; font-size: 50px; line-height: 1; color: var(--gold-text); }
.treasure .big.neg { color: var(--bad); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }

/* Wedstrijden */
.match { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; text-decoration: none; color: inherit; }
.date-block { text-align: center; border-right: 1px solid var(--line); padding-right: 10px; }
.date-block b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; }
.date-block span { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.match .opp { font-weight: 700; overflow-wrap: anywhere; }
.match .sub { font-size: 12.5px; color: var(--muted); }
.match .sc { font-family: var(--font-display); font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }

/* Tabellen */
.table-wrap { overflow-x: auto; }
@media (max-width: 560px) { .kl .xs { display: none; } .kl table { font-size: 13.5px; } .kl td, .kl th { padding-left: 5px; padding-right: 5px; } .schema-head .seg { flex-basis: 100%; } .kl .mrow { grid-template-columns: 1fr auto 1fr; } .kl .mrow .dt { display: none; } }
.kl table { width: 100%; }
.kl tr.team { cursor: pointer; } .kl tr.team:hover td { background: var(--surface-2); }
.kl td.tn { white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.kl .form { display: inline-flex; gap: 3px; } .kl .form i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.kl .form .W { background: var(--good); } .kl .form .V { background: var(--bad); } .kl .form .G { background: var(--muted); }
.kl tr.open-row td { padding: 0 6px 10px; background: var(--surface-2); }
.kl .gd-pos { color: var(--good); } .kl .gd-neg { color: var(--bad); }
.kl-us { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.kl-us b { display: block; font-size: 26px; font-family: var(--display, inherit); }
.kl-us span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mrow { display: grid; grid-template-columns: 54px 1fr auto 1fr; gap: 8px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px; }
.mrow:last-child { border-bottom: 0; } .mrow .h { text-align: right; } .mrow .sc { font-weight: 800; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
.mrow .dt { font-size: 12px; color: var(--muted); } .mrow .us { color: var(--gold-text, var(--gold)); font-weight: 800; }
.team-filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.team-filter button { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; }
.team-filter button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--on-gold); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }

const Live = {
  mode: "live", _uid: null, recovery: false,
  async init() {

    this.c = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey);

  },
  uid() { return this._uid; },
  async fetchAll() {

    const res = await Promise.all(tables.map((t) => this.c.from(t).select("*")));

    out.messages = []; const st = await this.c.from("settings").select("*"); out.settings = st.error ? [] : st.data;

  async signUp(email, password, name, code) {

  async resetPassword(email) { const { error } = await this.c.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); if (error) throw error; },

  async signOut() { await this.c.auth.signOut(); this._uid = null; },
  async upsert(table, row) { const { error } = await this.c.from(table).upsert(row); if (error) throw error; },
  async remove(table, match) { const { error } = await this.c.from(table).delete().match(match); if (error) throw error; },
  async sendMessage(body) { const { data, error } = await this.c.from("messages").insert({ body, player_id: this._uid }).select().single(); if (error) throw error; return data; },

function niceError(e) {

  if (/already registered|already been registered/i.test(m)) return "Er bestaat al een account met dit e-mailadres. Log in of vraag een nieuw wachtwoord.";
  if (/Database error saving new user|teamcode/i.test(m)) return "De teamcode klopt niet. Vraag hem aan de kapitein.";
  if (/Password should be/i.test(m)) return "Kies een wachtwoord van minstens 6 tekens.";
  if (/rate limit|security purposes/i.test(m)) return "Even te veel pogingen. Probeer het binnen een minuutje opnieuw.";

/* Zeekaart: cumulatief doelsaldo, zeeniveau = 0 */
function seaChart() {
  const ps = playedOurs(); if (!ps.length) return `<p class="muted">De zeekaart verschijnt na de eerste wedstrijd.</p>`;
  const pts = [0]; ps.forEach((m) => { const s = side(m); pts.push(pts[pts.length - 1] + s.us - s.them); });
  const W = 600, H = 200, L = 38, R = 16, T = 14, B = 30;
  const max = Math.max(5, ...pts.map(Math.abs)); const step = max <= 10 ? 5 : max <= 30 ? 10 : 20; const lim = Math.ceil(max / step) * step;
  const x = (i) => L + (i * (W - L - R)) / Math.max(1, pts.length - 1); const y = (v) => T + ((lim - v) * (H - T - B)) / (2 * lim);
  const path = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ticks = []; for (let v = -lim; v <= lim; v += step) ticks.push(v);
  const last = pts.length - 1;
  const abbr = (n) => n.split(/[\s/-]+/).filter(Boolean).map((w) => w[0]).join("").slice(0, 3).toUpperCase();
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Doelsaldo na elke wedstrijd, nu ${pts[last] > 0 ? "+" : ""}${pts[last]}">
    <rect x="${L}" y="${y(0)}" width="${W - L - R}" height="${H - B - y(0)}" fill="var(--sea)"/>
    ${ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`).join("")}
    <text x="${W - R - 4}" y="${y(0) + 15}" text-anchor="end">zeeniveau</text>
    <path d="${path} L${x(last)},${y(0)} L${x(0)},${y(0)} Z" fill="var(--gold)" fill-opacity=".16"/>
    <path d="${path}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((v, i) => (i ? `<circle cx="${x(i)}" cy="${y(v)}" r="${i === last ? 5.5 : 3.5}" fill="${i === last ? "var(--gold)" : "var(--surface)"}" stroke="var(--gold)" stroke-width="2"/>` : "")).join("")}
    <text x="${x(0)}" y="${H - 10}" text-anchor="middle">start</text>
    ${ps.map((m, i) => `<text x="${x(i + 1)}" y="${H - 10}" text-anchor="${i + 1 === last ? "end" : "middle"}">${esc(abbr(side(m).opp))}</text>`).join("")}
  </svg>`;
}

  return `<div class="stack"><div><p class="eyebrow">Account</p><h1>${t === "signup" ? "Monster aan" : t === "reset" ? "Wachtwoord vergeten" : "Log in"}</h1><hr class="rule"></div>
  <div class="seg" role="group" aria-label="Kies"><button type="button" data-act="authtab" data-t="login" aria-pressed="${t === "login"}">Inloggen</button><button type="button" data-act="authtab" data-t="signup" aria-pressed="${t === "signup"}">Account maken</button></div>
  ${t === "login" ? `<form class="card stack" data-form="login"><div class="field"><label for="li-e">E-mailadres</label><input id="li-e" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="li-p">Wachtwoord</label><input id="li-p" name="pw" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Inloggen</button><button type="button" class="btn ghost sm" data-act="authtab" data-t="reset">Wachtwoord vergeten?</button></form>` : ""}
  ${t === "signup" ? `<form class="card stack" data-form="signup"><div class="field"><label for="su-n">Naam</label><input id="su-n" name="name" type="text" maxlength="40" autocomplete="given-name" required></div><div class="field"><label for="su-e">E-mailadres</label><input id="su-e" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="su-p">Wachtwoord (min. 6 tekens)</label><input id="su-p" name="pw" type="password" minlength="6" autocomplete="new-password" required></div><div class="field"><label for="su-c">Teamcode</label><input id="su-c" name="code" type="text" autocomplete="off" required placeholder="Vraag de kapitein"></div><button class="btn" type="submit">Account maken</button><p class="muted" style="font-size:12.5px;margin:0">De teamcode zorgt dat alleen de ploeg een account kan maken. Je e-mailadres is niet zichtbaar voor anderen.</p></form>` : ""}
  ${t === "reset" ? `<form class="card stack" data-form="reset"><div class="field"><label for="rs-e">E-mailadres</label><input id="rs-e" name="email" type="email" autocomplete="email" required></div><button class="btn" type="submit">Stuur herstelmail</button></form>` : ""}
  <p class="muted" style="font-size:13px;margin:0">Iedereen met de link kan het schema, de stand en de rankings bekijken. Inloggen is alleen nodig om aanwezigheden, goals en stemmen door te geven.</p></div>`;
}

/* ---------- router ---------- */
function currentView() { const h = decodeURIComponent(location.hash.slice(1)); if (!h || h.includes("=")) return ["home"]; if (h.startsWith("match-")) return ["match", h.slice(6)]; return [["home", "aanwezig", "schema", "ranking", "profiel", "installeren", "chat"].includes(h) ? h : "home"]; }
function render() {
  const [v, arg] = currentView(); const app = $("#app");
  const html = v === "aanwezig" ? viewAanwezig() : v === "schema" ? viewSchema() : v === "ranking" ? viewRanking() : v === "profiel" ? viewProfiel() : v === "match" ? viewMatch(arg) : v === "installeren" ? viewInstall() : v === "chat" ? viewChat() : viewHome();
  const demo = S.api.mode === "demo" && v !== "chat" ? `<div class="banner" style="margin-bottom:14px">Voorbeeldmodus: spelers, goals en stemmen zijn verzonnen en blijven in jouw browser. Het schema en de stand komen echt uit Tournify.</div>` : "";
  const keepY = S.lastView === v ? window.scrollY : null;
  app.innerHTML = demo + html;
  if (keepY != null) window.scrollTo(0, keepY);
  const navV = v === "match" ? "schema" : v === "installeren" ? "profiel" : v;
  document.querySelectorAll(".nav a").forEach((a) => { if (a.dataset.v === navV) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const u = me(); $("#who").innerHTML = u ? `<span class="avatar">${av(u)}</span><span>${esc(pname(u))}</span>` : `<span class="btn sm ghost">Inloggen</span>`;
  const tp = $("#theme-pick"); if (tp) tp.value = store.get("sp-theme") || "";
  if (v === "chat") { fitChat(); markChatSeen(); if (S.lastView !== "chat") requestAnimationFrame(scrollChatBottom); }
  S.lastView = v;
  updateChatDot(); if (me() && S.api.subscribeChat) S.api.subscribeChat(); if (S.api.subscribeLive) S.api.subscribeLive();
}
/* app vergrendelen: geen zoom door dubbeltikken of knijpen (vraag van de kapitein) */
let lastTap = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTap < 400 && !e.target.closest("input, select, textarea")) { e.preventDefault(); const t = e.target.closest("button, a, [data-act], label"); if (t) t.click(); }
  lastTap = now;
}, { passive: false });
["gesturestart", "gesturechange", "gestureend"].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("touchmove", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.api) Promise.all([loadMatchData(), reloadDb()]).then(liveRender).catch(() => {}); });
setInterval(() => { if (document.visibilityState === "visible" && S.api) loadMatchData().then(liveRender); }, 120000);
let lastHash = "";
window.addEventListener("hashchange", () => { S.lastView = null; render(); if (location.hash !== lastHash) { window.scrollTo(0, 0); lastHash = location.hash; } });

/* ---------- actions ---------- */
async function act(fn, okMsg) { try { await fn(); await reloadDb(); render(); if (okMsg) toast(okMsg); return true; } catch (e) { console.error(e); toast(niceError(e)); return false; } }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT") return;
  const d = b.dataset; const u = me();
  switch (d.act) {
    case "rsvp": if (!u) return; act(() => S.api.upsert("attendance", { match_id: d.m, player_id: u.id, status: d.s }), d.s === "yes" ? "Top, je bent aan boord!" : d.s === "fan" ? "Top, je staat bij de supporters!" : d.s === "maybe" ? "Genoteerd als misschien." : "Jammer! Genoteerd."); break;
    case "goal": { const cur = S.db.goals.find((g) => g.match_id === d.m && g.player_id === d.p) || { goals: 0, assists: 0 }; const val = Math.max(0, Math.min(30, (cur[d.f] || 0) + Number(d.d)));
      act(() => S.api.upsert("goals", { match_id: d.m, player_id: d.p, goals: d.f === "goals" ? val : cur.goals || 0, assists: d.f === "assists" ? val : cur.assists || 0 })); break; }
    case "limit": { if (!isAdmin()) return; const n = Math.max(5, Math.min(30, maxP() + Number(d.d))); act(() => S.api.upsert("settings", { key: "max_players", value: n }), `Limiet staat nu op ${n} spelers.`); break; }
    case "nogoal": if (!u) return; act(() => S.api.upsert("goals", { match_id: d.m, player_id: u.id, goals: 0, assists: 0 }), "Genoteerd. Volgende keer prijs! ⚽"); break;
    case "jump": document.getElementById(d.to)?.scrollIntoView({ behavior: "smooth", block: "start" }); break;
    case "pstep": { const mm = (S.data.matches || []).find((x) => x.id === d.m); const mine = S.db.predictions.find((p) => p.match_id === d.m && p.player_id === u?.id);
      const cur = pdraft[d.m] || (mine ? { us: mine.us, them: mine.them } : { us: 0, them: 0 }); pdraft[d.m] = { ...cur, [d.k]: Math.max(0, Math.min(40, cur[d.k] + Number(d.d))) };
      const y = window.scrollY; render(); window.scrollTo(0, y); const again = document.querySelector(`[data-act="pstep"][data-m="${CSS.escape(d.m)}"][data-k="${d.k}"][data-d="${d.d}"]`); if (again) again.focus(); void mm; break; }
    case "psave": { if (!u) return; const dr = pdraft[d.m] || { us: 0, them: 0 }; act(() => S.api.upsert("predictions", { match_id: d.m, player_id: u.id, us: dr.us, them: dr.them }), "Pronostiek opgeslagen. Succes!").then((ok) => ok && delete pdraft[d.m]).then(() => render()); break; }
    case "installhide": store.set("sp-install-hide", "1"); render(); toast("Je vindt de uitleg later terug bij Profiel."); break;
    case "installnow": if (deferredInstall) { deferredInstall.prompt(); deferredInstall.userChoice.finally(() => { deferredInstall = null; render(); }); } break;
    case "chatsel": { const it = b.closest(".chat-item"); const was = it.classList.contains("sel"); document.querySelectorAll(".chat-item.sel").forEach((x) => x.classList.remove("sel")); if (!was) it.classList.add("sel"); break; }
    case "chatdel": e.stopPropagation(); S.api.deleteMessage(Number(d.id)).then(() => { S.db.messages = S.db.messages.filter((m) => String(m.id) !== d.id); if (S.api.mode === "demo") S.api.db.messages = S.db.messages.slice(); onChatUpdate(); toast("Bericht verwijderd."); }).catch((err) => toast(niceError(err))); break;
    case "late": case "paid": if (!isAdmin()) return; chatSend(`§${d.act === "late" ? "laat" : "betaald"}:${d.m}|${d.p}|${d.v}`).then((ok) => { if (ok) { render(); toast(d.act === "late" ? (d.v === "1" ? "Op te laat gezet: trakteren! 🍻" : "Te laat geschrapt.") : d.v === "1" ? "Genoteerd: getrakteerd ✓" : "Teruggezet."); } }); break;
    case "chatreact": chatSend(`§react:${d.id}:${d.e}`); break;
    case "chatvote": chatSend(`§vote:${d.id}:${d.i}`); break;
    case "gostand": S.schemaTab = "stand"; store.set("sp-schema-tab", "stand"); location.hash = "schema"; break;
    case "tray": chatTray = d.t || false; rerenderComposer(); if (chatTray === "poll") $("#composer input[name=q]")?.focus(); scrollChatBottom(); break;
    case "quick": {
      const n = nextMatch(); const q = d.q;
      if (q === "match" && n) chatSend(`§match:${n.id}`);
      if (q === "stand") chatSend("§stand");
      if (q === "wekker" && n) { const ids = S.db.profiles.filter((p) => !att(n.id, p.id)).map((p) => p.id); chatSend(`§wekker:${n.id}|${ids.join(",")}`); }
      if (q === "lot") { const pool = n ? attFor(n.id).filter((a) => a.status === "yes").map((a) => a.player_id) : []; const ids = pool.length >= 2 ? pool : S.db.profiles.map((p) => p.id); chatSend(`§lot:${ids[Math.floor(Math.random() * ids.length)]}|${LOTS[Math.floor(Math.random() * LOTS.length)]}`); }
      if (q === "bevel") { const i = $("#chat-in"); const t = (i?.value || "").trim(); if (!t) { toast("Typ eerst je bevel in het tekstvak."); i?.focus(); return; } chatDraft = ""; chatSend(`§bevel:${t}`).then(() => { const j = $("#chat-in"); if (j) j.value = ""; }); }
      if (q === "notif") { if (store.get("sp-notif") === "1" && Notification.permission === "granted") { store.set("sp-notif", "0"); toast("Chatmeldingen uit."); rerenderComposer(); return; }
        Notification.requestPermission().then((r) => { if (r === "granted") { store.set("sp-notif", "1"); toast("Meldingen aan zolang de app open staat."); } else toast("Meldingen zijn geblokkeerd in je instellingen."); rerenderComposer(); }); return; }
      chatTray = false; rerenderComposer(); break;
    }
    case "klrow": klOpen = klOpen === d.t ? null : d.t; render(); break;
    case "klteam": klTeam = d.t; store.set("sp-kl-team", d.t); render(); break;
    case "schematab": S.schemaTab = d.t; store.set("sp-schema-tab", d.t); if (location.hash === "#schema") render(); break;
    case "authtab": S.authTab = d.t; render(); break;
    case "demologin": act(() => S.api.signInAs(d.p), "Welkom aan boord!").then(() => (location.hash = "home")); break;
    case "logout": act(() => S.api.signOut(), "Uitgelogd."); break;
    case "demoreset": S.api.reset(); act(async () => {}, "Voorbeeld teruggezet."); break;
    case "reload": refresh(); break;
    case "avatar": { const f = b.closest("form"); f.querySelector('[name="avatar"]').value = d.a; f.querySelectorAll('[data-act="avatar"]').forEach((x) => x.setAttribute("aria-pressed", String(x === b))); break; }
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "chat-in") chatDraft = e.target.value; });
document.addEventListener("change", (e) => {
  const el = e.target; const d = el.dataset; const u = me();
  if (d.act === "vote" && u) act(() => (el.value ? S.api.upsert("votes", { match_id: d.m, voter_id: u.id, category: d.c, nominee_id: el.value }) : S.api.remove("votes", { match_id: d.m, voter_id: u.id, category: d.c })), "Stem opgeslagen.");
  if (d.act === "adminatt") act(() => (el.value ? S.api.upsert("attendance", { match_id: d.m, player_id: d.p, status: el.value }) : S.api.remove("attendance", { match_id: d.m, player_id: d.p })), "Aanwezigheid aangepast.");
  if (d.act === "theme") { if (el.value) document.documentElement.setAttribute("data-theme", el.value); else document.documentElement.removeAttribute("data-theme"); store.set("sp-theme", el.value); }
});
document.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f)); const u = me();
  switch (f.dataset.form) {
    case "login": act(() => S.api.signIn(v.email.trim(), v.pw), "Welkom terug!").then((ok) => ok && (location.hash = "home")); break;
    case "signup": act(async () => { const r = await S.api.signUp(v.email.trim(), v.pw, v.name.trim(), v.code.trim()); if (r === "confirm") setTimeout(() => toast("Check je mailbox om je account te bevestigen."), 2700); }, "Account gemaakt. Welkom aan boord!"); break;
    case "reset": act(() => S.api.resetPassword(v.email.trim()), "Herstelmail verstuurd als dat adres bestaat."); break;
    case "newpw": act(() => S.api.updatePassword(v.pw), "Nieuw wachtwoord opgeslagen."); break;
    case "profile": act(() => S.api.upsert("profiles", { id: u.id, name: v.name.trim(), nickname: v.nickname.trim() || null, number: v.number === "" ? null : Number(v.number), position: v.position, avatar: v.avatar, motto: v.motto.trim() || null }), "Profiel opgeslagen."); break;
    case "chat": { let body = (v.body || "").trim(); if (!body || !u) break; if (body[0] === "§") body = " " + body; const prev = chatDraft; chatDraft = ""; const i = $("#chat-in"); if (i) i.value = "";
      chatSend(body.slice(0, 500)).then((ok) => { if (ok) { scrollChatBottom(); $("#chat-in")?.focus(); } else { chatDraft = prev; const j = $("#chat-in"); if (j) j.value = prev; } }); break; }
    case "poll": { const opts = [v.o1, v.o2, v.o3, v.o4].map((o) => (o || "").replace(/\|/g, "/").trim()).filter(Boolean); const q = (v.q || "").replace(/\|/g, "/").trim(); if (!q || opts.length < 2) break;
      chatSend(`§poll:${[q, ...opts].join("|")}`).then((ok) => { if (ok) { chatTray = false; rerenderComposer(); scrollChatBottom(); } }); break; }
    case "predict": act(() => S.api.upsert("predictions", { match_id: f.dataset.m, player_id: u.id, us: Number(v.us), them: Number(v.them) }), "Voorspelling opgeslagen."); break;
  }
});

/* ---------- boot ---------- */
async function loadMatchData() {
  try { const r = await fetch(CONFIG.dataUrl + "?t=" + Math.floor(Date.now() / 6e4), { cache: "no-store" }); if (!r.ok) throw new Error(r.status); S.data = await r.json(); }
  catch (e) { if (SEED_DATA) S.data = SEED_DATA; else console.warn("Geen wedstrijddata", e); }
}
async function reloadDb() { const db = await S.api.fetchAll(); S.db = { profiles: [], attendance: [], goals: [], votes: [], predictions: [], messages: [], settings: [], ...db }; S.db.messages = [...(S.db.messages || [])]; S.db.profiles = [...S.db.profiles].sort((a, b) => pname(a).localeCompare(pname(b), "nl")); }
async function refresh() { try { await reloadDb(); } catch (e) { toast(niceError(e)); } render(); }
(async function boot() {
  const th = store.get("sp-theme"); if (th) document.documentElement.setAttribute("data-theme", th);
  S.api = CONFIG.supabaseUrl && CONFIG.supabaseAnonKey ? Live : Demo;
  try { await S.api.init(); } catch (e) { console.error(e); S.api = Demo; await Demo.init(); toast("Database niet bereikbaar, voorbeeldmodus actief."); }
  await Promise.all([loadMatchData(), reloadDb().catch((e) => toast(niceError(e)))]);
  lastHash = location.hash; render();
  setInterval(() => { const [v] = currentView(); if (v === "home" && !document.querySelector("input:focus,select:focus")) render(); }, 60e3);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S.api.mode === "live") refresh(); });
})();
</script>
